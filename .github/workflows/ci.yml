name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Validate content
        run: pnpm content:validate
      - name: Build content bundle
        run: pnpm content:bundle
      - name: Test
        run: pnpm test
      - name: Build the platform
        run: pnpm build:web
      - name: Browser for Playwright
        run: pnpm --filter @moonbridge/e2e exec playwright install --with-deps chromium
      - name: End-to-end on a phone screen
        run: pnpm --filter @moonbridge/e2e moonbridge
      - name: End-to-end, the school (teacher, invitation, homework file, second phone)
        run: pnpm --filter @moonbridge/e2e school
      - name: End-to-end, the pilot rehearsal (three students, five days, the metrics page)
        run: pnpm --filter @moonbridge/e2e pilot
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: e2e/.artifacts/
