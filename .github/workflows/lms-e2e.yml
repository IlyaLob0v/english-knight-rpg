name: LMS end-to-end

# The whole integration against real services: Moodle 4.5 (LTI 1.3 + AGS), the LRS and
# Postgres from compose.yaml, the gateway and the game client, driven by Playwright.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "apps/**"
      - "packages/**"
      - "content/**"
      - "docker/**"
      - "e2e/**"
      - "compose.yaml"
      - "pnpm-lock.yaml"
      - ".github/workflows/lms-e2e.yml"
  workflow_dispatch:

jobs:
  lms:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Browser for Playwright
        run: pnpm --filter @knight/e2e exec playwright install --with-deps chromium
      - name: Postgres, LRS and Moodle (installs and provisions Moodle)
        run: sh docker/setup.sh
      - name: Gateway and game client
        run: |
          pnpm --filter @knight/server start:lms > gateway.log 2>&1 &
          pnpm dev:client > client.log 2>&1 &
          for url in http://localhost:8787/health http://localhost:5173; do
            timeout 60 sh -c "until curl -sf -o /dev/null $url; do sleep 1; done"
          done
      - name: End-to-end
        run: pnpm e2e:lms
      - name: Service logs
        if: failure()
        run: |
          docker compose logs --tail=200 > compose.log 2>&1 || true
          tail -n 200 gateway.log client.log || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: lms-e2e
          path: |
            gateway.log
            client.log
            compose.log
            e2e/.artifacts/
